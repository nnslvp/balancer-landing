# Основные настройки сайта
name: "Balancer"
title: "Balancer — приложение для учета совместных расходов"
description: "Умное приложение для учета групповых расходов с автоматической минимизацией переводов. Отслеживайте траты, делите счета и контролируйте долги в группах."
lang: ru
locale: ru_RU
timezone: Europe/Moscow

# SEO
author: "Balancer Team"
keywords: "балансер, совместные расходы, учет расходов, разделение счета, групповые траты, splitwise аналог, учет долгов, приложение для путешествий, учет долгов приложение, как разделить счет, расходы в поездке"

# Social
twitter:
  card: summary_large_image
image: /assets/og-image.png

# GitHub Pages
url: "https://balancerapp.nnslvp.io"
baseurl: ""

# Тема и плагины
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Markdown/рендеринг
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Структура ссылок
permalink: pretty

# Значения по умолчанию
defaults:
  - scope:
      path: ""
    values:
      layout: page

# Навигация
header_pages:
  - contacts.md
  - privacy-policy.md
